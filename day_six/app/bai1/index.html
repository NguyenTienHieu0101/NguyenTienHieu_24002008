<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 1 - Thẻ thông tin sinh viên</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }
    .grade-good { color: #166534; background: #dcfce7; }
    .grade-average { color: #854d0e; background: #fef9c3; }
    .grade-fail { color: #991b1b; background: #fee2e2; }
    .grade-invalid { color: #475569; background: #e2e8f0; }
    .status { color: #475569; }
    
  </style>
</head>
<body>
  <main id="app" >
    <h1>Thẻ thông tin sinh viên</h1>

    <section aria-label="Cập nhật thông tin sinh viên">
      <label>
        Mã sinh viên
        <input v-model.trim="student.id" type="text" placeholder="VD: SV001">
      </label>
      <label>
        Họ và tên
        <input v-model="student.name" type="text" placeholder="Nhập họ và tên">
      </label>
      <label>
        Lớp
        <input v-model="student.className" type="text" placeholder="VD: CNTT01">
      </label>
      <label>
        Đường dẫn ảnh đại diện
        <input v-model.trim="student.avatar" type="url" placeholder="https://...">
      </label>
      <label>
        Điểm trung bình
        <input v-model.number="student.average" type="number" min="0" max="10" step="0.1">
      </label>
      <label>
        Trạng thái
        <select v-model="student.isStudying">
          <option :value="true">Đang học</option>
          <option :value="false">Đã nghỉ</option>
        </select>
      </label>
    </section>

    <article v-show="showDetails" >
      <img
        v-if="student.avatar"
        class="avatar"
        :src="student.avatar"
        :alt="'Ảnh đại diện của ' + student.name"
      >
      <div v-else class="avatar" role="img" :aria-label="'Chưa có ảnh đại diện của ' + student.name"></div>
      <div >
        <h2>{{ student.name || 'Chưa nhập họ tên' }}</h2>
        <p><strong>Mã sinh viên:</strong> {{ student.id || 'Chưa cập nhật' }}</p>
        <p><strong>Lớp:</strong> <span v-text="student.className || 'Chưa cập nhật'"></span></p>
        <p>
          <strong>Điểm trung bình:</strong>
          {{ Number.isFinite(student.average) ? student.average.toFixed(1) : 'Chưa cập nhật' }}
        </p>
        <span  :class="gradeClass">{{ gradeLabel }}</span>
        <p  v-text="student.isStudying ? 'Đang học' : 'Đã nghỉ'"></p>
      </div>
    </article>

    <button type="button" @click="showDetails = !showDetails">
      {{ showDetails ? 'Ẩn thông tin' : 'Hiện thông tin' }}
    </button>
  </main>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          showDetails: true,
          student: {
            id: 'SV001',
            name: 'Nguyễn Minh Anh',
            className: 'CNTT01',
            avatar: '',
            average: 8.2,
            isStudying: true
          }
        };
      },
      computed: {
        validAverage() {
          return Number.isFinite(this.student.average)
            && this.student.average >= 0
            && this.student.average <= 10;
        },
        gradeLabel() {
          if (!this.validAverage) return 'Điểm không hợp lệ';
          if (this.student.average >= 8) return 'Giỏi';
          if (this.student.average >= 6.5) return 'Khá';
          if (this.student.average >= 5) return 'Trung bình';
          return 'Chưa đạt';
        },
        gradeClass() {
          if (!this.validAverage) return 'grade-invalid';
          if (this.student.average >= 6.5) return 'grade-good';
          if (this.student.average >= 5) return 'grade-average';
          return 'grade-fail';
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
