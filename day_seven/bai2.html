<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2 - Danh mục sản phẩm</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="components/TheSanPham.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #1e293b;
      background: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      color: #0f172a;
    }

    .intro {
      margin: 0 0 24px;
      color: #64748b;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      align-items: start;
    }

    .product-card {
      overflow: hidden;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 14px rgb(15 23 42 / 5%);
    }

    .product-image {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #e2e8f0;
    }

    .product-content {
      padding: 18px;
    }

    .product-content h2 {
      margin: 0 0 10px;
      color: #0f172a;
      font-size: 1.15rem;
    }

    .product-price {
      margin: 0 0 10px;
      color: #1d4ed8;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .stock-badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .in-stock {
      color: #166534;
      background: #dcfce7;
    }

    .out-of-stock {
      color: #991b1b;
      background: #fee2e2;
    }

    .product-description {
      margin: 0 0 14px;
      color: #475569;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      min-height: 40px;
      padding: 8px 12px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: #2563eb;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      color: #64748b;
      background: #e2e8f0;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main id="app">
    <h1>Danh mục sản phẩm</h1>
    <p class="intro">Mỗi thẻ sản phẩm là một component có trạng thái mô tả độc lập.</p>

    <section class="product-list" aria-label="Danh sách sản phẩm">
      <the-san-pham
        v-for="product in products"
        :key="product.id"
        :ten="product.name"
        :gia="product.price"
        :anh="product.image"
        :mo-ta="product.description"
        :so-luong-ton="product.stock"
      ></the-san-pham>
    </section>
  </main>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          products: [
            {
              id: 1,
              name: 'Tai nghe không dây',
              price: 850000,
              image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80',
              description: 'Tai nghe không dây gọn nhẹ, âm thanh rõ và thời lượng pin dài.',
              stock: 12
            },
            {
              id: 2,
              name: 'Bình giữ nhiệt',
              price: 250000,
              image: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=800&q=80',
              description: 'Bình inox hai lớp giúp giữ nóng hoặc lạnh cho đồ uống.',
              stock: 8
            },
            {
              id: 3,
              name: 'Sổ tay bìa cứng',
              price: 95000,
              image: 'https://images.unsplash.com/photo-1531346878377-a5be20888e57?auto=format&fit=crop&w=800&q=80',
              description: 'Sổ tay nhỏ gọn, phù hợp ghi chú trong học tập và công việc.',
              stock: 20
            },
            {
              id: 4,
              name: 'Loa Bluetooth mini',
              price: 590000,
              image: 'https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=800&q=80',
              description: 'Loa Bluetooth di động với thiết kế nhỏ gọn, dễ mang theo.',
              stock: 0
            }
          ]
        };
      }
    })
      .component('the-san-pham', window.TheSanPham)
      .mount('#app');
  </script>
</body>
</html>
